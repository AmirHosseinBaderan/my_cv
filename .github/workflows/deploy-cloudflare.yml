name: Deploy to Cloudflare Workers

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '*' # Triggers automatically on any git tag push
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Prevent concurrent deployments from colliding
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build for Cloudflare
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🚀 Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          # Method 1: API Token Authentication (Recommended)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Method 2: User Email + Global API Key (User & Password fallback)
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}

      - name: ✅ Deployment Notification
        if: success()
        run: |
          echo "=========================================="
          echo "🚀 Successfully deployed to Cloudflare Workers!"
          echo "🏷️ Tag: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "=========================================="
